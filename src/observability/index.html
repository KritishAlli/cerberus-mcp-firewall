<!doctype html>
<!--
  OWNER: Kritish — live, read-only monitor UI (design doc §8).
  Plain HTML/CSS/JS, no React. Uses EventSource('/events').
  Shows ONLY real events and counters: no prepopulated numbers or fake green status.
  Every event field is rendered with textContent, never innerHTML.
  File-change events show counts, paths and rule IDs only: they never carry contents.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Firewall Monitor</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --text: #1d1d1b;
        --muted: #6b6b66;
        --border: #e2e1dc;
        --allow: #1f7a4d;
        --allow-bg: #e6f4ec;
        --deny: #b42318;
        --deny-bg: #fdecea;
        --warn: #9a6700;
        --warn-bg: #fdf3d8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141413;
          --panel: #1e1e1c;
          --text: #ecebe6;
          --muted: #9b9a94;
          --border: #33322f;
          --allow: #5cc68f;
          --allow-bg: #17301f;
          --deny: #f2877c;
          --deny-bg: #3a1a17;
          --warn: #e3b341;
          --warn-bg: #362a10;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 1000px; margin: 0 auto; }
      header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; justify-content: space-between; }
      h1 { margin: 0; font-size: 20px; }
      #status { color: var(--muted); }
      #status.ok { color: var(--allow); }
      #status.bad { color: var(--warn); }
      .counters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
      @media (max-width: 560px) { .counters { grid-template-columns: repeat(2, 1fr); } }
      .counter { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
      .counter span { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      .counter strong { font-size: 28px; font-variant-numeric: tabular-nums; }
      .counter.allowed strong { color: var(--allow); }
      .counter.denied strong { color: var(--deny); }
      .counter.blocked strong { color: var(--warn); }
      .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 500; font-size: 12px; }
      tr:last-child td { border-bottom: none; }
      td.time, td.tool { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      td.summary { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-word; }
      .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
      .badge.ALLOW { color: var(--allow); background: var(--allow-bg); }
      .badge.DENY { color: var(--deny); background: var(--deny-bg); }
      .badge.BLOCKED { color: var(--warn); background: var(--warn-bg); }
      .rule { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
      #empty { padding: 24px; text-align: center; color: var(--muted); }
      tr.files td { padding-top: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-word; }
      tr.files td.line { color: var(--allow); }
      tr.files.has-rejected td.line { color: var(--warn); }
      tr.files.orphan td { padding-top: 8px; }
      tr.files td.line::before { content: 'files '; color: var(--muted); }
      tr.call.has-files td { border-bottom: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>MCP Firewall</h1>
        <span id="status">Connecting…</span>
      </header>

      <section class="counters" aria-label="Counters">
        <div class="counter"><span>Inspected</span><strong id="inspected">–</strong></div>
        <div class="counter allowed"><span>Allowed</span><strong id="allowed">–</strong></div>
        <div class="counter denied"><span>Denied</span><strong id="denied">–</strong></div>
        <div class="counter blocked"><span>Writes blocked</span><strong id="writesBlocked">–</strong></div>
      </section>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Time</th><th>Tool</th><th>Decision</th><th>Reason</th><th>Summary</th></tr>
          </thead>
          <tbody id="feed"></tbody>
        </table>
        <div id="empty">No tool calls yet.</div>
      </div>
    </main>

    <script>
      const MAX_ROWS = 500;
      const feed = document.getElementById('feed');
      const empty = document.getElementById('empty');
      const statusEl = document.getElementById('status');

      function cell(className, text) {
        const td = document.createElement('td');
        if (className) td.className = className;
        td.textContent = text;
        return td;
      }

      function addRow(event) {
        const tr = document.createElement('tr');
        tr.className = 'call';
        tr.dataset.requestId = event.requestId;
        tr.appendChild(cell('time', new Date(event.timestamp).toLocaleTimeString()));
        tr.appendChild(cell('tool', event.serverId + '/' + event.toolName));

        const decision = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge ' + (event.decision === 'ALLOW' ? 'ALLOW' : 'DENY');
        badge.textContent = event.decision;
        const rule = document.createElement('span');
        rule.className = 'rule';
        rule.textContent = event.ruleId;
        decision.append(badge, rule);
        tr.appendChild(decision);

        tr.appendChild(cell('', event.reason));
        tr.appendChild(cell('summary', event.summary));
        feed.prepend(tr);
        trimFeed();
        empty.hidden = true;
      }

      function trimFeed() {
        while (feed.rows.length > MAX_ROWS) feed.deleteRow(feed.rows.length - 1);
      }

      function findCallRow(requestId) {
        for (const row of feed.rows) {
          if (row.classList.contains('call') && row.dataset.requestId === requestId) return row;
        }
        return null;
      }

      // Goes directly under its call's row, and marks an ALLOW call whose writes were rejected.
      // With no call row ("<late-writes>", "<startup>", or a call that left the buffer) it stands alone.
      function addFileChanges(event) {
        const tr = document.createElement('tr');
        const blocked = event.rejected > 0;
        tr.className = 'files' + (blocked ? ' has-rejected' : '');
        const call = findCallRow(event.requestId);
        let line;
        if (call) {
          tr.appendChild(cell('', ''));
          tr.appendChild(cell('', ''));
          line = cell('line', event.line);
          line.colSpan = 3;
          const badge = call.querySelector('.badge');
          if (blocked && badge && badge.classList.contains('ALLOW')) {
            badge.className = 'badge BLOCKED';
            badge.textContent = 'ALLOW · WRITES BLOCKED';
          }
        } else {
          tr.classList.add('orphan');
          tr.appendChild(cell('time', new Date(event.timestamp).toLocaleTimeString()));
          tr.appendChild(cell('tool', event.serverId + '/' + event.toolName));
          const decision = document.createElement('td');
          const badge = document.createElement('span');
          badge.className = 'badge ' + (blocked ? 'BLOCKED' : 'ALLOW');
          badge.textContent = blocked ? 'WRITES BLOCKED' : 'WRITES APPLIED';
          decision.appendChild(badge);
          tr.appendChild(decision);
          line = cell('line', event.line);
          line.colSpan = 2;
        }
        tr.appendChild(line);
        if (call) {
          call.classList.add('has-files');
          call.after(tr);
        } else {
          feed.prepend(tr);
        }
        trimFeed();
        empty.hidden = true;
      }

      function setCounts(counts) {
        document.getElementById('inspected').textContent = counts.inspected;
        document.getElementById('allowed').textContent = counts.allowed;
        document.getElementById('denied').textContent = counts.denied;
        document.getElementById('writesBlocked').textContent = counts.writesBlocked;
      }

      // "Live" needs both: the event stream is open AND /health says a server is protected.
      let streamOpen = false;
      let health = null; // last /health body, or null if unreachable

      function renderStatus() {
        let ok = false;
        let text;
        if (!streamOpen) text = 'Disconnected, retrying…';
        else if (!health) text = 'Firewall unreachable';
        else if (health.status !== 'ok') text = 'No downstream server connected';
        else {
          ok = true;
          const n = health.protectedServers;
          text = 'Live · protecting ' + n + ' server' + (n === 1 ? '' : 's');
        }
        statusEl.className = ok ? 'ok' : 'bad';
        statusEl.textContent = text;
      }

      async function refreshHealth() {
        try {
          health = await (await fetch('/health')).json();
        } catch {
          health = null;
        }
        renderStatus();
      }

      const source = new EventSource('/events');
      source.addEventListener('open', () => {
        // The server replays its buffer on every (re)connect, so start clean.
        feed.replaceChildren();
        empty.hidden = false;
        streamOpen = true;
        refreshHealth();
      });
      source.addEventListener('firewall', (e) => addRow(JSON.parse(e.data)));
      source.addEventListener('filechanges', (e) => addFileChanges(JSON.parse(e.data)));
      source.addEventListener('counts', (e) => setCounts(JSON.parse(e.data)));
      source.addEventListener('error', () => {
        streamOpen = false;
        renderStatus();
      });
      setInterval(refreshHealth, 5000);
    </script>
  </body>
</html>
